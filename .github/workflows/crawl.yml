name: Daily ATS Ingestion & Dataset Refresh

on:
  schedule:
    - cron: '0 4 * * *'  # Trigger daily at 04:00 UTC
  workflow_dispatch:      # Enable manual triggering from GitHub UI

permissions:
  contents: write

jobs:
  daily-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ingest ATS Job Snapshots
        run: |
          python -m ghostjob.cli crawl --concurrency 5

      - name: Run 3-Tier Deduplication
        run: |
          python -m ghostjob.cli dedup

      - name: Compute Ghost-Job Scores & Explainability
        run: |
          python -m ghostjob.cli score

      - name: Export Updated Datasets
        run: |
          python -m ghostjob.cli export --format json --output data/exports/jobs_export.json
          python -m ghostjob.cli export --format csv --output data/exports/jobs_export.csv

      - name: Commit and Push Daily Refreshed Dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): automated daily ATS crawl & snapshot refresh [skip ci]"
            git push
          fi
